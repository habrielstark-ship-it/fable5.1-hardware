<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>OONE — Соревнования и награды · Сообщество и общение</title>
<style>

.tx{width:960px;text-align:center;transform-origin:50% 0}

.acc{color:#A5E800}
.u{position:relative;display:inline-block;white-space:nowrap}
.u svg{position:absolute;left:-8px;top:100%;margin-top:-.2em;overflow:visible}
.u svg path{fill:none;stroke:#A5E800;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.cv{font-family:'Caveat Brush',Caveat;font-weight:700}
.pill{background:#1E1E1E;border:1.5px solid rgba(255,255,255,.08);border-radius:999px;display:flex;align-items:center;justify-content:center;gap:16px;font-weight:600;white-space:nowrap}
.cen{display:flex;align-items:center;justify-content:center;white-space:nowrap}
</style>
</head>
<body>
<div id="stage"></div>
<svg width="0" height="0" style="position:absolute"><defs>
  <radialGradient id="cg" cx=".34" cy=".28" r=".85"><stop offset="0" stop-color="#FFEDB0"/><stop offset=".45" stop-color="#FFC21A"/><stop offset="1" stop-color="#BF7A00"/></radialGradient>
  <clipPath id="gc"><rect x="4" y="4" width="192" height="122" rx="20"/></clipPath>
</defs></svg>
<script src="timeline.js"></script>
<script>
'use strict';
const { S, K } = TL;
const stage = document.getElementById('stage');
const LIME = '#A5E800', LOGO = '#CAFD3A', PURPLE = '#8E3FD8', GOLD = '#FFC21A', CARD = '#1E1E1E';

/* ---------- math ---------- */
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, u) => a + (b - a) * u;
const p = (t, t0, d) => clamp((t - t0) / d);
function bez(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  return x => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let u = x;
    for (let i = 0; i < 10; i++) { const e = ((ax * u + bx) * u + cx) * u - x, d = (3 * ax * u + 2 * bx) * u + cx; if (Math.abs(e) < 1e-6 || Math.abs(d) < 1e-6) break; u -= e / d; }
    u = clamp(u); return ((ay * u + by) * u + cy) * u;
  };
}
const eOut = bez(.16, 1, .3, 1), eIO = bez(.65, 0, .35, 1), eIn = bez(.55, 0, .85, .35), eSoft = bez(.33, 1, .68, 1);
// closed-form damped spring, 0 -> 1
const spr = (t, t0, f = 2.4, z = .62) => { const x = t - t0; if (x <= 0) return 0; const w = 2 * Math.PI * f, wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * x) * (Math.cos(wd * x) + (z * w / wd) * Math.sin(wd * x)); };
const win = (t, a, b, fi = .4, fo = .4) => Math.min(p(t, a, fi), 1 - p(t, b - fo, fo));
const bump = (t, t0, d = .45) => Math.sin(Math.PI * p(t, t0, d));
const hx = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16));
const mix3 = (A, B, u) => A.map((v, i) => lerp(v, B[i], u));
const rgb = (a, al) => al == null ? `rgb(${a.map(v => Math.round(v)).join(',')})` : `rgba(${a.map(v => Math.round(v)).join(',')},${al.toFixed(3)})`;
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let x = Math.imul(s ^ (s >>> 15), 1 | s); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }

/* ---------- dom ---------- */
function mk(parent, w, h, css, html) {
  const n = document.createElement('div');
  n.style.width = w + 'px'; n.style.height = h + 'px';
  if (css) Object.assign(n.style, css);
  if (html) n.innerHTML = html;
  parent.appendChild(n); n._w = w; n._h = h; return n;
}
function SZ(n, w, h) { n._w = w; n._h = h; n.style.width = w.toFixed(2) + 'px'; n.style.height = h.toFixed(2) + 'px'; }
function P(n, cx, cy, o = 1, s = 1, r = 0) {
  if (!(o > .003)) { n.style.display = 'none'; return; }
  n.style.display = ''; n.style.opacity = o >= .999 ? '1' : o.toFixed(4);
  n.style.transform = `translate(${(cx - n._w / 2).toFixed(2)}px,${(cy - n._h / 2).toFixed(2)}px) rotate(${r.toFixed(3)}deg) scale(${s.toFixed(4)})`;
}
const FILL = { inset: '0', width: '100%', height: '100%' };
const img = (file, extra = '') => `url(assets/${file}) ${extra}`;

/* ---------- icons ---------- */
const coinSVG = s => `<svg class="rel" width="${s}" height="${s}" viewBox="0 0 100 100" style="display:block"><circle cx="50" cy="50" r="48" fill="url(#cg)"/><circle cx="50" cy="50" r="38.5" fill="none" stroke="rgba(255,255,255,.38)" stroke-width="2.5"/><path d="M57 15 30 56h17l-5 29 29-43H53z" fill="#FFF8E1"/></svg>`;
const CAN = `<g transform="rotate(-10 50 54)"><path d="M32 36h23l13 12v30a8 8 0 0 1-8 8H32a8 8 0 0 1-8-8V44a8 8 0 0 1 8-8z" fill="#fff"/><rect x="32" y="43" width="18" height="9.5" rx="4.75" fill="#151515"/><rect x="59.5" y="26" width="11" height="13" rx="3.5" fill="#fff" transform="rotate(42 65 33)"/></g>`;
const tankRing = s => `<svg class="rel" width="${s}" height="${s}" viewBox="0 0 124 124" style="display:block"><circle cx="62" cy="62" r="60" fill="#151515"/><circle cx="62" cy="62" r="52" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="9"/><circle class="arc" cx="62" cy="62" r="52" fill="none" stroke="${LOGO}" stroke-width="9" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0" transform="rotate(-90 62 62)"/><g transform="translate(25 24) scale(.74)">${CAN}</g></svg>`;
const leafSVG = s => `<svg class="rel" width="${s}" height="${s}" viewBox="0 0 24 24" style="display:block"><path d="M20.5 3.5C11 3 4.500 8 4.500 15.500c0 1.100.2 2.200.6 3.100L3.300 20.400a1 1 0 0 0 1.400 1.400l1.800-1.800c.9.400 2 .6 3.100.6 7.500 0 11.400-7.600 10.900-17.100z" fill="#151515"/><path d="M8.200 16.200c2.300-3.600 5-5.900 8.300-7.800" fill="none" stroke="${LIME}" stroke-width="1.500" stroke-linecap="round"/></svg>`;
const checkSVG = (s, col = '#151515', sw = 3.2) => `<svg class="rel" width="${s}" height="${s}" viewBox="0 0 24 24" style="display:block"><path d="M5.500 12.600l4.200 4.200 8.800-9.600" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

const clockSVG = s => `<svg class="rel" width="${s}" height="${s}" viewBox="0 0 24 24" style="display:block"><circle cx="12" cy="12" r="9" fill="none" stroke="#fff" stroke-width="2.200"/><path d="M12 7v5.300l3.400 2" fill="none" stroke="#fff" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const hornSVG = s => `<svg class="rel" width="${s}" height="${s}" viewBox="0 0 24 24" style="display:block"><path d="M3.500 10.300v3.400a1.300 1.300 0 0 0 1.300 1.300h2.700l6.500 4.300V4.700L7.500 9H4.800a1.300 1.300 0 0 0-1.300 1.300z" fill="#fff"/><path d="M17.300 8.800a4.600 4.600 0 0 1 0 6.400M19.800 6.500a8 8 0 0 1 0 11" fill="none" stroke="#fff" stroke-width="1.900" stroke-linecap="round"/></svg>`;
const giftSVG = `<svg class="rel" width="230" height="150" viewBox="0 0 200 130" style="display:block"><g clip-path="url(#gc)"><rect x="4" y="4" width="192" height="122" fill="#2C2C2C"/><rect x="60" y="4" width="18" height="122" fill="${LIME}"/><rect x="4" y="54" width="192" height="18" fill="${LIME}"/></g><path d="M69 54C50 22 26 44 60 54M69 54C88 22 112 44 78 54" fill="none" stroke="${LIME}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const voucherSVG = `<svg class="rel" width="230" height="150" viewBox="0 0 200 130" style="display:block"><path d="M20 4h160a16 16 0 0 1 16 16v28a17 17 0 0 0 0 34v28a16 16 0 0 1-16 16H20A16 16 0 0 1 4 110V82a17 17 0 0 0 0-34V20A16 16 0 0 1 20 4z" fill="#2C2C2C"/><path d="M134 16v98" stroke="#1E1E1E" stroke-width="4" stroke-dasharray="7 8" stroke-linecap="round"/><rect x="30" y="42" width="78" height="12" rx="6" fill="rgba(255,255,255,.3)"/><rect x="30" y="66" width="52" height="12" rx="6" fill="rgba(255,255,255,.16)"/><circle cx="165" cy="65" r="12" fill="${LIME}"/></svg>`;
const FLAGS = {
  de: 'linear-gradient(#111 0 33.300%,#DD0000 33.300% 66.600%,#FFCE00 66.600%)', fr: 'linear-gradient(90deg,#0055A4 0 33.300%,#fff 33.300% 66.600%,#EF4135 66.600%)',
  it: 'linear-gradient(90deg,#009246 0 33.300%,#fff 33.300% 66.600%,#CE2B37 66.600%)', nl: 'linear-gradient(#AE1C28 0 33.300%,#fff 33.300% 66.600%,#21468B 66.600%)',
  pl: 'linear-gradient(#fff 0 50%,#DC143C 50%)', at: 'linear-gradient(#ED2939 0 33.300%,#fff 33.300% 66.600%,#ED2939 66.600%)',
};
const avatar = (parent, d, id, bg) => { const n = mk(parent, d, d, { borderRadius: '50%', background: bg, overflow: 'hidden' }); mk(n, d, d, Object.assign({ background: img(`av_${id}.png`, '50% 0/cover no-repeat') }, FILL)); return n; };

/* ---------- layers (back to front) ---------- */
const glowP = mk(stage, 880, 880, { background: 'radial-gradient(closest-side,rgba(142,63,216,.5),rgba(142,63,216,.16) 48%,rgba(142,63,216,0))' });
const glowL = mk(stage, 760, 760, { background: 'radial-gradient(closest-side,rgba(202,253,58,.32),rgba(202,253,58,.09) 48%,rgba(202,253,58,0))' });
const mapN = mk(stage, 1500, 1745, { background: img('map.png', 'center/100% 100% no-repeat'), transformOrigin: '36% 36%', webkitMaskImage: 'linear-gradient(180deg,transparent 5%,#000 17%,#000 62%,transparent 80%)' });

const CW = 600, CH = 780, CY = 1085, CHIPY = 706;

/* ---------- B/C/D/E: tour pills -> leaderboard rows -> podium ---------- */
const RD = [
  { av: '056', bg: '#C7B8F0', flag: 'de', nw: 210, pw: 100 },
  { av: '048', bg: '#A8E6BE', flag: 'fr', nw: 170, pw: 92 },
  { av: '019', bg: '#A9D4F2', flag: 'it', nw: 240, pw: 84 },

];
const PLACE = { 0: 0, 3: 1, 1: 2 };                                   // row index -> podium place
const BASE = 1660, COL = [{ x: 540, H: 800 }, { x: 222, H: 650 }, { x: 858, H: 520 }];
const rowY = pos => 820 + pos * 140;
const NEWRANK = { 3: '2', 1: '3', 2: '4' };
const ROW = RD.map((d, i) => {
  const n = mk(world, 920, 124, { borderRadius: '38px', overflow: 'visible', zIndex: d.user ? 8 : 5 });
  const r = { d, n };

  r.fillW = mk(n, 10, 10, Object.assign({ borderRadius: 'inherit', overflow: 'hidden' }, FILL));
  r.fill = mk(r.fillW, 10, 10, { height: '100%', background: LIME, borderRadius: 'inherit' });
  const rk = { fontWeight: 600, fontSize: '36px', lineHeight: '44px', textAlign: 'center', color: 'rgba(255,255,255,.5)' };
  r.rank1 = mk(n, 60, 44, rk, String(i + 1));
  r.rank2 = mk(n, 60, 44, rk, NEWRANK[i] || '');
  r.ring = mk(n, 108, 108, { borderRadius: '50%', border: `5px solid ${LOGO}` });
  r.av = avatar(n, 88, d.av, d.bg);
  r.flag = mk(n, 40, 28, { borderRadius: '7px', background: FLAGS[d.flag] });
  r.name = mk(n, d.nw, 18, { borderRadius: '9px' });
  r.kmT = mk(n, 190, 8, { borderRadius: '4px', background: 'rgba(255,255,255,.12)', overflow: 'hidden' });
  r.kmF = mk(r.kmT, 190, 8, { borderRadius: '4px', background: LIME, transformOrigin: '0 50%' });

  r.leaf = mk(n, 56, 56, { borderRadius: '50%', background: LIME }, `<div class="cen" style="inset:0;width:100%;height:100%">${leafSVG(36)}</div>`);
  r.coin = mk(n, 40, 40, {}, coinSVG(40));
  r.pts = mk(n, d.pw, 18, { borderRadius: '9px', background: 'rgba(255,194,26,.42)' });
  const ac = d.user ? LIME : 'rgba(255,255,255,.34)';
  r.arr = mk(n, 26, 22, {}, `<svg class="rel" width="26" height="22" viewBox="0 0 26 22" style="display:block"><path d="M13 3 23 19H3z" fill="${ac}" stroke="${ac}" stroke-width="3" stroke-linejoin="round"/></svg>`);
  r.crown = mk(n, 70, 70, { background: img('crown.png', 'center/contain no-repeat') });
  r.num = mk(n, 140, 130, { fontSize: '136px', lineHeight: '130px', textAlign: 'center' }, `<span class="cv">${(PLACE[i] ?? 0) + 1}</span>`);
  r.dol = mk(n, 150, 68, { borderRadius: '34px', background: '#151515', border: '1.5px solid rgba(255,255,255,.1)' }, `<div class="cen" style="inset:0;width:100%;height:100%;gap:12px;font-weight:600;font-size:36px">$<span style="letter-spacing:5px;color:rgba(255,255,255,.55);font-size:30px;margin-top:-14px">...</span></div>`);
  return r;
});

/* ---------- hand-drawn arrows / lines ---------- */
const NS = 'http://www.w3.org/2000/svg';
const fx = document.createElementNS(NS, 'svg'); fx.setAttribute('class', 'abs'); fx.setAttribute('width', 1080); fx.setAttribute('height', 1920); fx.style.zIndex = 20; fx.style.overflow = 'visible'; world.appendChild(fx);
function arrow(d, ex, ey, ang, col = LIME, wdt = 5) {
  const g = document.createElementNS(NS, 'g'); g.setAttribute('fill', 'none'); g.setAttribute('stroke', col); g.setAttribute('stroke-width', wdt); g.setAttribute('stroke-linecap', 'round'); g.setAttribute('stroke-linejoin', 'round');
  const a = document.createElementNS(NS, 'path'); a.setAttribute('d', d); a.setAttribute('pathLength', 1); a.setAttribute('stroke-dasharray', 1);
  const h = document.createElementNS(NS, 'path'); const L = 20, r = Math.PI / 180;
  const pt = s => `${(ex - L * Math.cos((ang + s) * r)).toFixed(1)} ${(ey - L * Math.sin((ang + s) * r)).toFixed(1)}`;
  h.setAttribute('d', `M${pt(30)} L${ex} ${ey} L${pt(-30)}`);
  g.appendChild(a); g.appendChild(h); fx.appendChild(g);
  return (q, o = 1) => { if (q <= .001 || o <= .003) { g.style.display = 'none'; return; } g.style.display = ''; g.style.opacity = o.toFixed(3); a.style.strokeDashoffset = (1 - q).toFixed(4); h.style.opacity = p(q, .82, .18).toFixed(3); };
}
const arInvite = arrow('M392 822 C470 742 612 742 690 816', 690, 816, 48);
const arBack = arrow('M692 978 C614 1056 470 1056 394 984', 394, 984, 224);
function line(x1, y1, x2, y2) { const l = document.createElementNS(NS, 'path'); l.setAttribute('d', `M${x1} ${y1} L${x2} ${y2}`); l.setAttribute('pathLength', 1); l.setAttribute('fill', 'none'); l.setAttribute('stroke', LIME); l.setAttribute('stroke-width', 3); l.setAttribute('stroke-linecap', 'round'); fx.appendChild(l); return l; }

/* ---------- hero avatar (the viewer's own profile; it travels through the film) ---------- */
const heroRing = mk(world, 10, 10, { border: `7px solid ${LOGO}`, zIndex: 30 });
const hero = mk(world, 10, 10, { overflow: 'hidden', zIndex: 31, background: '#D9D9D9' });
mk(hero, 10, 10, Object.assign({ background: img('av_024.png', '50% 0/cover no-repeat') }, FILL));
const heroBadge = mk(world, 64, 64, { zIndex: 33 }, tankRing(64));

/* ---------- F: reward options ---------- */
const OPT = [{ x: 310, svg: giftSVG, label: 'Подарочные<br>карты' }, { x: 770, svg: voucherSVG, label: 'Ваучеры' }].map(o => {

/* ---------- G: extra-reward chips ---------- */

/* ---------- H: two balances ---------- */
const HC = [0, 1].map(k => {

});
const HCY = [846, 1220];

/* ---------- T2 / I: community, nickname, avatar ---------- */
const SIDE = [{ id: '048', bg: '#A8E6BE', dx: -122 }, { id: '019', bg: '#A9D4F2', dx: 122 }].map(s => Object.assign(s, { n: avatar(world, 132, s.id, s.bg) }));
SIDE.forEach(s => s.n.style.zIndex = 29);
const PEEK = [{ id: '056', bg: '#D8DCC3', x: 132 }, { id: '033', bg: '#F4A3AE', x: 948 }].map(s => {

        r.gold.style.opacity = (mE * (place === 0 ? 1 : .7)).toFixed(3); r.gold.style.display = mE > .003 ? '' : 'none';
        P(r.num, w / 2, 302, mE * clamp((hh - 340) / 90));
        P(r.dol, w / 2, h - 70, p(t, K.dollar + place * .08, .1) * mE, spr(t, K.dollar + place * .08, 2.4, .55) * [1.12, 1, .92][place]);
      } else { P(r.crown, 0, 0, 0); P(r.num, 0, 0, 0); P(r.dol, 0, 0, 0); r.gold.style.display = 'none'; }
    });
  }

  /* ---- F: choose the reward ---- */
  OPT.forEach((o, k) => {
    const a = eOut(p(t, K.opts + k * .1, .6)), out = eIn(p(t, K.optsOut + (k ? 0 : .06), .34)), pick = eOut(p(t, K.pick, .4));
    o.sel.style.opacity = k ? '0' : pick.toFixed(3);
    P(o.chk, 420 - 26, 26, k ? 0 : p(t, K.pick + .06, .1), spr(t, K.pick + .06, 2.6, .5));
    P(o.n, o.x, 1180 + (1 - a) * 110 + out * 90, a * (1 - out) * (k ? 1 - .5 * pick : 1), k ? 1 - .03 * pick : 1 + .035 * pick);
  });

  /* ---- G: extra rewards ---- */
  CHIP.forEach((c, k) => {
    const s = spr(t, K.chips[k], 2.3, .56), out = p(t, K.chipsOut + k * .04, .26);
    P(c, k ? 760 : 318, 1090 + (1 - Math.min(1, s)) * 50 - 30 * eIn(out) + 5 * Math.sin(TAU * (t * .5 + k * .4)), p(t, K.chips[k], .12) * (1 - out), 1.25 * (.6 + .4 * s));
  });

  /* ---- H: Sparks decide the result, OONE is a separate balance ---- */
  HC.forEach((c, k) => {
    const a = eOut(p(t, K.tiles[k], .7)), out = eIn(p(t, K.tilesOut + k * .04, .36)), cy = HCY[k] + (1 - a) * 90 - out * 40;
    P(c.n, 540, cy, a * (1 - out), 1 - .05 * out);
    if (a <= .003) return;
    const ic = spr(t, K.tiles[k] + .12, 2.2, .55), hit = bump(t, K.hit[k], .45);
    P(c.icon, 460, 104, 1, (.5 + .5 * ic) * (1 + .16 * hit), k ? 0 : (1 - Math.min(1, ic)) * -40);
    P(c.glow, 460, 104, .55 + .45 * hit);
    c.ln.forEach((d, i) => lineAnim(d, t, K.tileTxt[k], null, i));
  });

  /* ---- hero avatar thread ---- */
  {
    let s = null, o = 0, bg = [217, 217, 217];
    if (t >= K.heroUp && t < S.H + .4) { s = mixP(POSE.POD, POSE.F, eIO(p(t, K.heroUp, .6))); const out = p(t, K.chipsOut, .3); o = 1 - out; s.cy -= 40 * eIn(out); }
    else if (t >= K.cluster) {
      const pop = spr(t, K.cluster, 2.2, .6);
      s = mixP(POSE.T2, POSE.I, eIO(p(t, K.toCard, .6)));
      s = mixP(s, POSE.J, eIO(p(t, K.toPin, .6)));
      s = mixP(s, POSE.K, eIO(p(t, K.sheet - .05, .6)));
      s = mixP(s, POSE.L, eIO(p(t, K.toL, .6)));
      if (t < K.toCard) { const q = .5 + .5 * pop; s.w *= q; s.h *= q; s.rad *= q; }
      o = p(t, K.cluster, .12) * (1 - p(t, K.lOut, .3));
      const inCard = eIO(p(t, K.toCard, .6)) * (1 - eIO(p(t, K.toPin, .6)));
      bg = mix3(bg, mix3(hx(DOTC[0]), hx(DOTC[3]), eIO(p(t, K.dot, .4))), inCard);
    }
    if (!s || o <= .003) { hero.style.display = 'none'; heroRing.style.display = 'none'; }
    else {
      SZ(hero, s.w, s.h); hero.style.borderRadius = s.rad.toFixed(1) + 'px'; hero.style.background = rgb(bg); P(hero, s.cx, s.cy, o);
      SZ(heroRing, s.w + 30, s.h + 30); heroRing.style.borderRadius = (s.rad + 15).toFixed(1) + 'px'; P(heroRing, s.cx, s.cy, o * s.ring);
    }
    P(heroBadge, POSE.L.cx + 62, POSE.L.cy + 58, p(t, K.badge, .1) * (1 - p(t, K.lOut, .3)), spr(t, K.badge, 2.5, .5));
  }

  /* ---- T2: the community gathers ---- */
  SIDE.forEach((s, k) => {
    const t0 = K.cluster + .08 + k * .08, pop = spr(t, t0, 2.2, .6), out = eIO(p(t, K.toCard - .05, .5));
    P(s.n, 540 + s.dx * (1 + .5 * out), 1172, p(t, t0, .12) * (1 - out), (.5 + .5 * pop) * (1 - .15 * out));
  });

  /* ---- I: nickname + avatar picker ---- */
  {
    const out = p(t, K.toPin, .25);
    PEEK.forEach((s, k) => { const a = eOut(p(t, K.toCard + .22 + k * .05, .7)); P(s.n, s.x + (k ? 1 : -1) * (1 - a) * 110, 1128, .5 * a * (1 - out), .94 - .06 * out); });
    const dc = eIO(p(t, K.dot, .4));
    DOT.forEach((d, k) => { const t0 = S.I + .36 + k * .04; P(d, 540 + (k - 2.5) * 78, 1478, p(t, t0, .1) * (1 - out), spr(t, t0, 2.4, .6)); });
    P(dotRing, 540 + (lerp(0, 3, dc) - 2.5) * 78, 1478, p(t, S.I + .5, .2) * (1 - out));
    const a = eOut(p(t, K.nickIn, .6));
    P(nick, 540, 754 + (1 - a) * 40, a * (1 - out));
    const W = [150, 236, 176, 252]; let bw = W[0];
    K.nick.forEach((tn, k) => { bw = lerp(bw, W[k + 1], eOut(p(t, tn, .2))); });
    SZ(nickBar, bw, 22);
    const spin = K.nick.reduce((acc, tn) => acc + eIO(p(t, tn, .24)), 0);
    nickStar.style.transform = `rotate(${(spin * 90).toFixed(2)}deg) scale(${(1 + .25 * bump(t, K.nick[2] + .12, .4)).toFixed(3)})`;
  }

  /* ---- J/K: the map ---- */
  {
    const a = eSoft(p(t, K.toPin, .8)), dim = eIO(p(t, K.sheet - .1, .5)), out = p(t, K.toL, .4);
    const mo = a * lerp(.95, .3, dim) * (1 - out), ms = lerp(1.1, 1.0, eSoft(p(t, K.toPin, 4.2)));
    if (mo <= .003) mapN.style.display = 'none';
    else { mapN.style.display = ''; mapN.style.opacity = mo.toFixed(3); mapN.style.transform = `translate(0px,522px) scale(${ms.toFixed(4)})`; }
    const lg = eIO(p(t, K.league, .5)), gone = 1 - p(t, K.sheet - .1, .3);
    CL.forEach((c, k) => {
      const tp = K.pins + k * K.pinGap, s = spr(t, tp, 2.3, .58);
      P(c.node, c.x, c.y + 4 * Math.sin(TAU * (t * .4 + k * .21)), p(t, tp, .12) * (c.league ? 1 : 1 - .84 * lg) * gone, (.5 + .5 * s) * (c.league ? 1 + .06 * bump(t, K.league + .1, .5) : 1 - .1 * lg));
    });
    LLINE.forEach((l, k) => { const q = eIO(p(t, K.league + .05 + k * .06, .5)), o = .6 * gone; l.style.display = q > .001 && o > .003 ? '' : 'none'; l.style.opacity = o.toFixed(3); l.style.strokeDasharray = `${(q * .74).toFixed(4)} 2`; l.style.strokeDashoffset = '-0.16'; });
    PULSE.forEach((n, k) => { const q = p(t, [S.J + .5, K.league + .05][k], .9); P(n, 540, 1210, q > 0 && q < 1 ? .7 * (1 - q) : 0, .66 + 1.5 * eOut(q)); });
  }

  /* ---- K: chat settings ---- */
  {
    const a = eOut(p(t, K.sheet, .75)), out = eIn(p(t, K.toL - .04, .4));
    P(sheet, 540, 1300 + (1 - a) * 760 + out * 820, a > 0 ? 1 - p(out, .8, .2) : 0);
    const sel = eIO(p(t, K.select, .42));
    P(selBg, 460, lerp(SOPT[0].y, SOPT[1].y, sel), 1, 1 - .03 * Math.sin(Math.PI * sel));
    SOPT.forEach((o, i) => { o.lab.style.color = rgb(mix3(WHITE, INK, i === 0 ? 1 - sel : i === 1 ? sel : 0)); });
    P(chatBtn, 662, 734, p(t, K.chat, .1) * (1 - p(t, K.toL, .22)), spr(t, K.chat, 2.4, .55));
  }

  /* ---- L: invite a friend, both get tanks ---- */
  {
    const oo = 1 - p(t, K.lOut, .3);
    P(friend, 790, 900, p(t, K.friend, .12) * oo, spr(t, K.friend, 2.2, .58));
    arInvite(eIO(p(t, K.arrow1, .5)), oo); arBack(eIO(p(t, K.arrow2, .45)), oo);
    TANK.forEach((n, i) => { const tp = K.tanks + i * K.tankGap, s = spr(t, tp, 2.4, .55); n.querySelector('.arc').style.strokeDashoffset = (1 - eIO(p(t, tp + .05, .6))).toFixed(4); P(n, 196 + i * 172, 1214 + (1 - Math.min(1, s)) * 40, p(t, tp, .1) * oo, .5 + .5 * s); });
    const km = eIO(p(t, K.km, .6)), ra = eOut(p(t, K.km - .12, .5));
    P(road, 540, 1344, ra * oo); roadF.style.transform = `scaleX(${km.toFixed(4)})`;
    document.getElementById('kmN').textContent = String(Math.round(50 * km));
    P(kmLab, 540, 1418 + (1 - ra) * 30, ra * oo);
    P(days, 540, 1548, p(t, K.days, .1) * oo, spr(t, K.days, 2.4, .56));
  }

  /* ---- M: notifications ---- */
  {
    const out = eIO(p(t, K.end - .12, .26));
    BAN.forEach((n, i) => {
      const a = eOut(p(t, K.ban + i * K.banGap, .55));
      n.style.filter = a < .98 ? `blur(${((1 - a) * 8).toFixed(2)}px)` : 'none';
      P(n, 540, 760 + i * 156 + (1 - a) * 70 - 24 * out, a * (1 - out), (.94 + .06 * a) * (1 - .05 * out));
    });
  }

  /* ---- type ---- */
  for (const tx of TEXTS) {
    if (t < tx.t0 - .02 || t > tx.t1 + .02) { tx.box.style.display = 'none'; continue; }
    tx.box.style.display = '';
    tx.ln.forEach((d, i) => lineAnim(d, t, tx.t0, tx.t1, i));
    tx.ul.forEach(u => { u.style.strokeDashoffset = (1 - eIO(p(t, tx.t0 + .32, .5))).toFixed(4); });
    tx.w.forEach((w, k) => { w.style.color = rgb(mix3(WHITE, LIME3, p(t, K.hl[k], .18)), lerp(.72, 1, p(t, K.hl[k], .18))); });
  }
}
window.renderAt = renderAt; window.seek = renderAt;
window.ready = (async () => {
  await document.fonts.load('600 78px Inter', 'Жя'); await document.fonts.load('700 48px Caveat', 'Жя'); await document.fonts.load('58px "Caveat Brush"', '12'); await document.fonts.ready;
  const urls = new Set();
  stage.querySelectorAll('*').forEach(n => { const m = /url\("?([^")]+)"?\)/.exec(n.style.backgroundImage || ''); if (m) urls.add(m[1]); });
  await Promise.all([...urls].map(u => { const i = new Image(); i.src = u; return i.decode().catch(() => { throw new Error('asset failed: ' + u.slice(0, 60)); }); }));
  layout(); renderAt(+new URLSearchParams(location.search).get('t') || 0);
  return true;
})();
