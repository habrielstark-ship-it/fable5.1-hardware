<!doctype html>
<html lang="ru">
<head>

<style>

</defs></svg>
<script src="timeline.js"></script>
<script>
'use strict';
const { S, K } = TL;
const stage = document.getElementById('stage');
const LIME = '#A5E800', LOGO = '#CAFD3A', PURPLE = '#8E3FD8', GOLD = '#FFC21A', CARD = '#1E1E1E';

/* ---------- math ---------- */
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, u) => a + (b - a) * u;
const p = (t, t0, d) => clamp((t - t0) / d);
function bez(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  return x => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let u = x;
    for (let i = 0; i < 10; i++) { const e = ((ax * u + bx) * u + cx) * u - x, d = (3 * ax * u + 2 * bx) * u + cx; if (Math.abs(e) < 1e-6 || Math.abs(d) < 1e-6) break; u -= e / d; }
    u = clamp(u); return ((ay * u + by) * u + cy) * u;
  };
}
const eOut = bez(.16, 1, .3, 1), eIO = bez(.65, 0, .35, 1), eIn = bez(.55, 0, .85, .35), eSoft = bez(.33, 1, .68, 1);
// closed-form damped spring, 0 -> 1
const spr = (t, t0, f = 2.4, z = .62) => { const x = t - t0; if (x <= 0) return 0; const w = 2 * Math.PI * f, wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * x) * (Math.cos(wd * x) + (z * w / wd) * Math.sin(wd * x)); };
const win = (t, a, b, fi = .4, fo = .4) => Math.min(p(t, a, fi), 1 - p(t, b - fo, fo));
const bump = (t, t0, d = .45) => Math.sin(Math.PI * p(t, t0, d));
const mixHex = (a, b, u) => { const h = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16)); const A = h(a), B = h(b); return 'rgb(' + A.map((v, i) => Math.round(lerp(v, B[i], u))).join(',') + ')'; };
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let x = Math.imul(s ^ (s >>> 15), 1 | s); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }

/* ---------- dom ---------- */
function mk(parent, w, h, css, html) {
  const n = document.createElement('div');
  n.style.width = w + 'px'; n.style.height = h + 'px';
  if (css) Object.assign(n.style, css);
  if (html) n.innerHTML = html;
  parent.appendChild(n); n._w = w; n._h = h; return n;
}
function SZ(n, w, h) { n._w = w; n._h = h; n.style.width = w.toFixed(2) + 'px'; n.style.height = h.toFixed(2) + 'px'; }
function P(n, cx, cy, o = 1, s = 1, r = 0) {
  if (!(o > .003)) { n.style.display = 'none'; return; }
  n.style.display = ''; n.style.opacity = o >= .999 ? '1' : o.toFixed(4);
  n.style.transform = `translate(${(cx - n._w / 2).toFixed(2)}px,${(cy - n._h / 2).toFixed(2)}px) rotate(${r.toFixed(3)}deg) scale(${s.toFixed(4)})`;
}
const img = (file, extra = '') => `url(assets/${file}) ${extra}`;

/* ---------- icons ---------- */
const coinSVG = s => `<svg class="rel" width="${s}" height="${s}" viewBox="0 0 100 100" style="display:block"><circle cx="50" cy="50" r="48" fill="url(#cg)"/><circle cx="50" cy="50" r="38.5" fill="none" stroke="rgba(255,255,255,.38)" stroke-width="2.5"/><path d="M57 15 30 56h17l-5 29 29-43H53z" fill="#FFF8E1"/></svg>`;
const canSVG = (s, col = '#fff', hole = '#151515') => `<svg class="rel" width="${s}" height="${s}" viewBox="0 0 100 100" style="display:block"><g transform="rotate(-10 50 54)"><path d="M32 36h23l13 12v30a8 8 0 0 1-8 8H32a8 8 0 0 1-8-8V44a8 8 0 0 1 8-8z" fill="${col}"/><rect x="32" y="43" width="18" height="9.5" rx="4.75" fill="${hole}"/><rect x="59.5" y="26" width="11" height="13" rx="3.5" fill="${col}" transform="rotate(42 65 33)"/></g></svg>`;

const giftSVG = `<svg class="rel" width="230" height="150" viewBox="0 0 200 130" style="display:block"><g clip-path="url(#gc)"><rect x="4" y="4" width="192" height="122" fill="#2C2C2C"/><rect x="60" y="4" width="18" height="122" fill="${LIME}"/><rect x="4" y="54" width="192" height="18" fill="${LIME}"/></g><path d="M69 54C50 22 26 44 60 54M69 54C88 22 112 44 78 54" fill="none" stroke="${LIME}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const voucherSVG = `<svg class="rel" width="230" height="150" viewBox="0 0 200 130" style="display:block"><path d="M20 4h160a16 16 0 0 1 16 16v28a17 17 0 0 0 0 34v28a16 16 0 0 1-16 16H20A16 16 0 0 1 4 110V82a17 17 0 0 0 0-34V20A16 16 0 0 1 20 4z" fill="#2C2C2C"/><path d="M134 16v98" stroke="#1E1E1E" stroke-width="4" stroke-dasharray="7 8" stroke-linecap="round"/><rect x="30" y="42" width="78" height="12" rx="6" fill="rgba(255,255,255,.3)"/><rect x="30" y="66" width="52" height="12" rx="6" fill="rgba(255,255,255,.16)"/><circle cx="165" cy="65" r="12" fill="${PURPLE}"/></svg>`;

  it: 'linear-gradient(90deg,#009246 0 33.300%,#fff 33.300% 66.600%,#CE2B37 66.600%)', nl: 'linear-gradient(#AE1C28 0 33.300%,#fff 33.300% 66.600%,#21468B 66.600%)',
  pl: 'linear-gradient(#fff 0 50%,#DC143C 50%)', at: 'linear-gradient(#ED2939 0 33.300%,#fff 33.300% 66.600%,#ED2939 66.600%)',

/* ---------- layers ---------- */
const glowP = mk(stage, 1100, 1100, { background: 'radial-gradient(closest-side,rgba(142,63,216,.5),rgba(142,63,216,.16) 48%,rgba(142,63,216,0))' });
const glowL = mk(stage, 900, 900, { background: 'radial-gradient(closest-side,rgba(202,253,58,.32),rgba(202,253,58,.09) 48%,rgba(202,253,58,0))' });

/* ---------- B: season covers + chip ---------- */

const ROW = RD.map((d, i) => {

  r.coin = mk(n, 40, 40, {}, coinSVG(40));

  r.arr = mk(n, 26, 22, {}, `<svg class="rel" width="26" height="22" viewBox="0 0 26 22" style="display:block"><path d="M13 3 23 19H3z" fill="${d.user ? LIME : 'rgba(255,255,255,.34)'}" stroke="${d.user ? LIME : 'rgba(255,255,255,.34)'}" stroke-width="3" stroke-linejoin="round"/></svg>`);
  r.crown = mk(n, 70, 70, { background: img('crown.png', 'center/contain no-repeat') });

  r.dol = mk(n, 150, 68, { borderRadius: '34px', background: '#151515', border: '1.5px solid rgba(255,255,255,.1)' }, `<div class="cen" style="inset:0;width:100%;height:100%;gap:12px;font-weight:600;font-size:36px">$<span style="letter-spacing:5px;color:rgba(255,255,255,.55);font-size:30px;margin-top:-14px">...</span></div>`);
  return r;
});
const NEWRANK = { 3: '2', 1: '3', 2: '4' };
ROW.forEach((r, i) => { if (NEWRANK[i]) r.rank2.textContent = NEWRANK[i]; });

/* ---------- hand-drawn arrows / lines ---------- */
const NS = 'http://www.w3.org/2000/svg';
const fx = document.createElementNS(NS, 'svg'); fx.setAttribute('class', 'abs'); fx.setAttribute('width', 1080); fx.setAttribute('height', 1920); fx.style.zIndex = 20; fx.style.overflow = 'visible'; world.appendChild(fx);
function arrow(d, ex, ey, ang, col = PURPLE, wdt = 5) {
  const g = document.createElementNS(NS, 'g'); g.setAttribute('fill', 'none'); g.setAttribute('stroke', col); g.setAttribute('stroke-width', wdt); g.setAttribute('stroke-linecap', 'round'); g.setAttribute('stroke-linejoin', 'round');
  const a = document.createElementNS(NS, 'path'); a.setAttribute('d', d); a.setAttribute('pathLength', 1); a.setAttribute('stroke-dasharray', 1);
  const h = document.createElementNS(NS, 'path'); const L = 20, r = Math.PI / 180;

  g.appendChild(a); g.appendChild(h); fx.appendChild(g);
  return (q, o = 1) => { if (q <= .001 || o <= .003) { g.style.display = 'none'; return; } g.style.display = ''; g.style.opacity = o.toFixed(3); a.style.strokeDashoffset = (1 - q).toFixed(4); h.style.opacity = p(q, .82, .18).toFixed(3); };
}

const CALL = [
  { txt: 'очки', x: 648, y: 946 }, { txt: 'никнеймы', x: 690, y: 1088 }, { txt: 'флаги стран', x: 652, y: 1366 },
].map(c => Object.assign(c, { n: mk(world, 300, 60, { fontFamily: 'Caveat', fontWeight: 700, fontSize: '52px', lineHeight: '60px', textAlign: 'center', zIndex: 21, whiteSpace: 'nowrap' }, c.txt) }));
function line(x1, y1, x2, y2) { const l = document.createElementNS(NS, 'path'); l.setAttribute('d', `M${x1} ${y1} L${x2} ${y2}`); l.setAttribute('pathLength', 1); l.setAttribute('fill', 'none'); l.setAttribute('stroke', LIME); l.setAttribute('stroke-width', 3); l.setAttribute('stroke-linecap', 'round'); l.setAttribute('stroke-dasharray', '1'); fx.appendChild(l); return l; }

/* ---------- hero avatar (the user) ---------- */

const hero = mk(world, 10, 10, { overflow: 'hidden', zIndex: 31, background: '#D9D9D9' });

/* ---------- G: bonus chips ---------- */

/* ---------- H: two balances ---------- */
